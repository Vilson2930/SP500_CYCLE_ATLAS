name: SP500 Cycle Atlas

on:

  # Execução manual pelo GitHub
  workflow_dispatch:

  # Execução automática
  schedule:
    # 12:00 UTC todos os dias
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:

  run-cycle-atlas:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ======================================================
      # 3. DEPENDÊNCIAS
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 4. VERIFICAR SECRET FRED
      # ======================================================

      - name: Check FRED API Key
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "❌ FRED_API_KEY não foi carregada."
            exit 1
          else
            echo "✅ FRED_API_KEY carregada corretamente."
          fi

      # ======================================================
      # 5. VERIFICAR SECRET NVIDIA
      # ======================================================

      - name: Check NVIDIA API Key
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "⚠️ NVIDIA_API_KEY não foi carregada."
            echo "⚠️ A auditoria IA usará o fail-safe e o Atlas continuará."
          else
            echo "✅ NVIDIA_API_KEY carregada corretamente."
          fi

      # ======================================================
      # 6. VERIFICAR SECRETS DO E-MAIL
      # ======================================================

      - name: Check Email Secrets
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -z "$EMAIL_USER" ]; then
            echo "❌ EMAIL_USER não foi carregado."
            exit 1
          fi

          if [ -z "$EMAIL_PASSWORD" ]; then
            echo "❌ EMAIL_PASSWORD não foi carregado."
            exit 1
          fi

          if [ -z "$EMAIL_TO" ]; then
            echo "❌ EMAIL_TO não foi carregado."
            exit 1
          fi

          echo "✅ Secrets de e-mail carregados corretamente."

      # ======================================================
      # 7. EXECUTAR ATLAS + AUDITORIA NVIDIA
      # ======================================================

      - name: Run SP500 Cycle Atlas
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -u main.py

      # ======================================================
      # 8. VERIFICAR AUDITORIA IA
      # ======================================================

      - name: Check AI Audit
        if: always()
        run: |
          echo "=========================================="
          echo "CHECK AI AUDIT"
          echo "=========================================="

          if [ -f data/ai_audit.json ]; then
            echo "✅ ai_audit.json encontrado."
            ls -lh data/ai_audit.json
          else
            echo "⚠️ ai_audit.json não encontrado."
          fi

      # ======================================================
      # 9. VERIFICAR PAINEL HTML
      # ======================================================

      - name: Check HTML Report
        run: |
          echo "=========================================="
          echo "CHECK HTML REPORT"
          echo "=========================================="

          if [ -f data/current_report.html ]; then
            echo "✅ current_report.html encontrado."
            ls -lh data/current_report.html
          else
            echo "❌ current_report.html não encontrado."
            exit 1
          fi

      # ======================================================
      # 10. GERAR PDF INSTITUCIONAL
      # ======================================================

      - name: Generate PDF Report
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u pdf_report.py

      # ======================================================
      # 11. VERIFICAR PDF
      # ======================================================

      - name: Check PDF Report
        run: |
          echo "=========================================="
          echo "CHECK PDF REPORT"
          echo "=========================================="

          if [ -f reports/relatorio_sp500_cycle_atlas.pdf ]; then
            echo "✅ PDF institucional encontrado."
            ls -lh reports/relatorio_sp500_cycle_atlas.pdf
          else
            echo "❌ PDF institucional não encontrado."
            exit 1
          fi

      # ======================================================
      # 12. ENVIAR PAINEL + PDF POR E-MAIL
      # ======================================================

      - name: Send SP500 Cycle Atlas Email
        timeout-minutes: 3
        env:
          PYTHONUNBUFFERED: "1"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -u email_report.py

      # ======================================================
      # 13. MOSTRAR ESTADO ATUAL
      # ======================================================

      - name: Show current state
        if: always()
        run: |
          echo "=========================================="
          echo "CURRENT STATE"
          echo "=========================================="

          if [ -f data/current_state.csv ]; then
            cat data/current_state.csv
          else
            echo "current_state.csv não encontrado."
          fi

      # ======================================================
      # 14. MOSTRAR RELATÓRIO TXT
      # ======================================================

      - name: Show report
        if: always()
        run: |
          echo "=========================================="
          echo "SP500 CYCLE ATLAS REPORT"
          echo "=========================================="

          if [ -f data/current_report.txt ]; then
            cat data/current_report.txt
          else
            echo "current_report.txt não encontrado."
          fi

      # ======================================================
      # 15. SALVAR RESULTADOS NO GITHUB
      # ======================================================

      - name: Commit updated data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/current_state.csv
          git add data/cycle_history.csv
          git add data/current_report.txt
          git add data/current_report.html
          git add data/ai_audit.json
          git add reports/relatorio_sp500_cycle_atlas.pdf

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Update SP500 Cycle Atlas"
            git push
          fi
